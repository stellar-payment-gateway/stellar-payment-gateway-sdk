name: Budget Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  budget-tests:
    name: Budget tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.93

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Generate Cargo.lock and pin ed25519-dalek
        run: |
          cargo generate-lockfile
          cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0 \
            || echo "ed25519-dalek 3.x not in lockfile; already compatible"

      - name: Run budget contract tests
        run: cargo test -p budget
