[package]
name = "soroban-upgradeable-contract-old-contract"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.89.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "23.0.1" }
governance-contract = { path = "../../governance" }

[dev-dependencies]
soroban-sdk = { version = "23.0.1", features = ["testutils"] }
governance-contract = { path = "../../governance" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
