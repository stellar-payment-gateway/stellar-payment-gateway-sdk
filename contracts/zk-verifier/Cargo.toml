[package]
name = "zk-verifier"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
ed25519-dalek = "2.2"

[features]
testutils = ["soroban-sdk/testutils"]
